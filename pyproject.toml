[project]
name = "nmr-agent"
version = "0.1.0"
description = "LLM-orchestrated 1D NMR interpretation microservice with deterministic verification"
requires-python = ">=3.12,<3.13"
dependencies = [
    "nmrglue==0.12",
    "numpy>=2,<3",
    "scipy>=1.17,<2",
    "rdkit==2026.3.6",
    "fastapi==0.142.4",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "uvicorn==0.54.0",
    "python-multipart==0.0.32",
    "anthropic==1.12.0",
    "httpx==0.28.1",
    "tenacity==9.2.1",
    "structlog==26.1.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls the real Anthropic API (main branch CI only)"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
